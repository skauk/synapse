# Local stack: FHIR server and the Matrix network (Synapse + Element Web).
# Setup: scripts/matrix-setup.sh. All ports are bound to localhost only.
services:
  hapi:
    image: hapiproject/hapi:latest
    ports: ["127.0.0.1:8080:8080"]
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.enforce_referential_integrity_on_write: "true"

  synapse:
    image: matrixdotorg/synapse:latest
    ports: ["127.0.0.1:8008:8008"]
    volumes: ["./matrix/synapse:/data"]
    # Lets Synapse reach the Worker that `wrangler dev` runs on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]

  element:
    image: vectorim/element-web:latest
    ports: ["127.0.0.1:8081:80"]
    volumes: ["./matrix/element-config.json:/app/config.json:ro"]
