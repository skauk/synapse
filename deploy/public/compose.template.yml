# GENERATED by deploy/public/build.py from the files next to it. Do not edit by hand.
# Public Matrix server for the judges, deployed to a remote Docker context:
#   AS_TOKEN=... HS_TOKEN=... HOST_PASSWORD=... JUDGE_TOKEN=... docker --context homer compose -f deploy/public/docker-compose.yml up -d
# A remote context does not upload bind-mounted files, so scripts and configs are inlined as compose `configs`.
# Point the tunnel hostnames at http://localhost:18008 (Synapse) and http://localhost:18081 (Element).
name: aimh-matrix

services:
  matrix-init:
    image: matrixdotorg/synapse:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    environment:
      AS_TOKEN: ${AS_TOKEN:?AS_TOKEN must match the Worker secret}
      HS_TOKEN: ${HS_TOKEN:?HS_TOKEN must match the Worker secret}
      SYNAPSE_SERVER_NAME: klinikum.example
      SYNAPSE_REPORT_STATS: "no"
      WORKER_URL: https://synapse.dingsbums.click
      PUBLIC_BASEURL: https://matrix.dingsbums.click
    volumes: ["synapse-data:/data"]
    configs:
      - { source: matrix-init, target: /init.sh }

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      matrix-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:18008:8008"]
    volumes: ["synapse-data:/data"]

  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    ports: ["127.0.0.1:18081:80"]
    configs:
      - { source: element-config, target: /app/config.json }

  seed:
    image: node:22-alpine
    entrypoint: ["node", "/seed.mjs"]
    restart: "no"
    depends_on: [synapse]
    environment:
      HOST_PASSWORD: ${HOST_PASSWORD:?HOST_PASSWORD is required}
      JUDGE_TOKEN: ${JUDGE_TOKEN:?JUDGE_TOKEN is required}
    volumes: ["synapse-data:/synapse-data:ro"]
    configs:
      - { source: seed, target: /seed.mjs }

volumes:
  synapse-data:

configs:
  matrix-init:
    content: |
@@matrix-init@@
  element-config:
    content: |
@@element-config@@
  seed:
    content: |
@@seed@@
